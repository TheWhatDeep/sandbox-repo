<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overhead Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sprite-editor.css">
</head>
<body>
<div class="app" id="app" data-mode="edit" data-focus="panel">
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">Overhead</span>
      <input id="project-name" class="project-name" aria-label="Game name" maxlength="60">
    </div>
    <div class="group">
      <button class="btn icon" id="btn-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button class="btn icon" id="btn-redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    </div>
    <div class="group">
      <span class="save-status hide-narrow" id="save-status">Saved in this browser</span>
      <button class="btn" id="btn-file" type="button">File</button>
      <button class="btn primary play-btn" id="btn-play" type="button" title="Play this room (Ctrl+Enter). Shift+click plays from the start room.">▶ <span class="hide-narrow">Play</span></button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel is-active" id="panel-project" aria-label="Project"><div id="tree"></div></aside>

    <section class="center">
      <div class="tabbar" id="tabbar" role="tablist" aria-label="Open documents"></div>
      <div class="docwrap">
        <div class="doc" id="doc"></div>
        <div class="game" id="game" hidden><canvas id="game-canvas" tabindex="0" aria-label="Game"></canvas></div>
      </div>
    </section>

    <nav class="mobile-tabs" role="tablist" aria-label="Panels">
      <button type="button" role="tab" data-tab="panel-project" aria-selected="true">Project</button>
      <button type="button" role="tab" data-tab="panel-props" aria-selected="false">Properties</button>
      <button type="button" role="tab" data-tab="panel-layers" aria-selected="false">Layers</button>
      <button type="button" role="tab" data-tab="panel-console" aria-selected="false">Console</button>
    </nav>

    <div class="side-right">
      <aside class="panel" id="panel-props" aria-label="Properties"><div id="props"></div></aside>
      <aside class="panel" id="panel-layers" aria-label="Layers"><div id="layers"></div></aside>
    </div>

    <section class="panel" id="panel-console" aria-label="Console and debugger">
      <div class="bottom-head">
        <div class="seg" id="bottom-seg"><button type="button" data-view="console" aria-pressed="true">Console</button><button type="button" data-view="debug" aria-pressed="false">Debugger</button></div>
        <span class="spacer"></span>
        <span class="muted small" id="dbg-stats"></span>
        <button class="btn small" id="console-clear" type="button">Clear</button>
      </div>
      <div class="console-log" id="console-log"></div>
      <div class="debugger" id="debugger" hidden></div>
    </section>
  </main>
</div>

<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/catalog.js"></script>
<script src="js/assets.js"></script>
<script src="js/runtime.js"></script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/editor.js"></script>
<script src="js/tree.js"></script>
<script src="js/room.js"></script>
<script src="js/inspector.js"></script>
<script src="js/sprite-editor.js"></script>
<script src="js/sheet.js"></script>
<script src="js/debug.js"></script>
<script src="js/sample.js"></script>
<script>OV.Debug.init(); OV.boot();</script>
</body>
</html>
